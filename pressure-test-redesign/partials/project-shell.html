<style>
/* ============================================================
   Project Shell — Shared Layout Fragment
   Sidebar + Topbar + page-body wrapper
   ============================================================ */

/* ── Layout ── */
.sh-app-layout {
  display: flex;
  min-height: 100vh;
  background: var(--bg-base-default);
  color: var(--text-default);
  font-family: var(--body-base-font-family);
  font-size: var(--body-base-font-size);
  line-height: var(--body-base-line-height);
}

/* ── Sidebar ── */
.sh-sidebar {
  width: 240px;
  min-width: 240px;
  height: 100vh;
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-base-secondary);
  border-right: 1px solid var(--border-neutral-l1);
}

.sh-sidebar__logo {
  display: flex;
  align-items: center;
  gap: var(--spacer-8);
  padding: var(--spacer-16) var(--spacer-16) var(--spacer-12);
}

.sh-sidebar__logo-icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.sh-sidebar__logo-text {
  font-family: var(--font-family-heading);
  font-size: var(--body-sm-strong-font-size);
  font-weight: var(--font-weight-strong);
  color: var(--text-default);
  letter-spacing: 0.06em;
}

/* ── Navigation ── */
.sh-nav {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: var(--spacer-8) var(--spacer-8);
  gap: 2px;
  overflow-y: auto;
}

.sh-nav__item {
  display: flex;
  align-items: center;
  gap: var(--spacer-8);
  padding: var(--spacer-8) var(--spacer-12);
  border-radius: var(--radius-6);
  border-left: 2px solid transparent;
  font-size: var(--body-base-font-size);
  line-height: var(--body-base-line-height);
  font-weight: var(--font-weight-medium);
  color: var(--text-secondary);
  text-decoration: none;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}

.sh-nav__item:hover {
  background: var(--bg-overlay-l2);
  color: var(--text-default);
}

.sh-nav__item.is-active {
  background: var(--bg-brand-popup);
  color: var(--text-brand);
  border-left-color: var(--bg-brand);
}

.sh-nav__item-step {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: var(--radius-4);
  background: var(--bg-overlay-l2);
  font-size: var(--body-xs-font-size);
  font-weight: var(--font-weight-strong);
  color: var(--text-tertiary);
  flex-shrink: 0;
}

.sh-nav__item.is-active .sh-nav__item-step {
  background: var(--bg-brand-popup);
  color: var(--text-brand);
}

.sh-nav__item-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.sh-nav__item-label {
  flex: 1;
  min-width: 0;
}

/* ── Sidebar Footer ── */
.sh-sidebar__footer {
  padding: var(--spacer-12) var(--spacer-16);
  border-top: 1px solid var(--border-neutral-l1);
  display: flex;
  flex-direction: column;
  gap: var(--spacer-8);
}

.sh-sidebar__quick-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacer-6);
  width: 100%;
  height: 32px;
  padding: 0 var(--spacer-12);
  border-radius: var(--radius-6);
  border: none;
  cursor: pointer;
  font-family: var(--body-sm-strong-font-family);
  font-size: var(--body-sm-strong-font-size);
  line-height: 1;
  font-weight: var(--body-sm-strong-font-weight);
  color: var(--text-onbrand);
  background: var(--bg-brand);
  transition: background 0.12s ease;
}

.sh-sidebar__quick-btn:hover {
  background: var(--bg-brand-hover);
}

.sh-sidebar__quick-btn-icon {
  width: 14px;
  height: 14px;
}

.sh-sidebar__badge-row {
  display: flex;
  align-items: center;
  gap: var(--spacer-8);
}

.sh-sidebar__mode-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 var(--spacer-6);
  height: 18px;
  border-radius: var(--radius-2);
  font-size: var(--body-xs-font-size);
  line-height: 1;
  background: var(--bg-overlay-l2);
  color: var(--text-secondary);
  border: 1px solid var(--border-neutral-l1);
  white-space: nowrap;
}

.sh-sidebar__mode-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--status-warning-default);
  flex-shrink: 0;
}

.sh-sidebar__disclaimer {
  font-size: var(--body-xs-font-size);
  line-height: var(--body-xs-line-height);
  color: var(--text-tertiary);
}

/* ── Main Content Area ── */
.sh-main-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── Top Bar ── */
.sh-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacer-16);
  padding: 0 var(--spacer-24);
  height: 48px;
  background: var(--bg-base-default);
  border-bottom: 1px solid var(--border-neutral-l1);
  flex-shrink: 0;
}

.sh-topbar__title-area {
  display: flex;
  align-items: center;
  gap: var(--spacer-12);
  min-width: 0;
}

.sh-topbar__page-title {
  font-size: var(--heading-sm-font-size);
  line-height: var(--heading-sm-line-height);
  font-weight: var(--font-weight-strong);
  color: var(--text-default);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sh-topbar__meta {
  display: flex;
  align-items: center;
  gap: var(--spacer-16);
  flex-shrink: 0;
}

.sh-topbar__status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 var(--spacer-8);
  height: 22px;
  border-radius: var(--radius-4);
  font-size: var(--body-xs-font-size);
  font-weight: var(--font-weight-medium);
  color: var(--status-success-default);
  background: var(--status-success-surface-l1);
  white-space: nowrap;
}

.sh-topbar__status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--status-success-default);
  flex-shrink: 0;
}

.sh-topbar__stats {
  display: flex;
  align-items: center;
  gap: var(--spacer-16);
  font-size: var(--body-sm-font-size);
  color: var(--text-secondary);
}

.sh-topbar__stats-item {
  display: flex;
  align-items: center;
  gap: var(--spacer-6);
  white-space: nowrap;
}

.sh-topbar__stats-value {
  color: var(--text-default);
  font-weight: var(--font-weight-medium);
  font-variant-numeric: tabular-nums;
}

/* ── Page Body ── */
.sh-page-body {
  flex: 1;
  padding: var(--spacer-24);
  min-height: 0;
}
</style>
